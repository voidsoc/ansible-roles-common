#cloud-config

hostname: {{ inventory_hostname }}
fqdn: {{ inventory_hostname }}
manage_etc_hosts: true
users:
{% for login, user in (virtual_preseed_users | default({})).items() %}
  - name: {{ login }}
    sudo: ALL=(ALL) NOPASSWD:ALL
    groups: users, login, sudo
    home: /home/{{ login }}
    shell: /bin/bash
    lock_passwd: false
    ssh-authorized-keys: {{ lookup('file', root_dir+'/files/ssh-keys/'+login).split('\n') }}
{% endfor %}
{% if ( sshd_password_auth | default("no") ) | bool %}
ssh_pwauth: true
{% else %}
ssh_pwauth: false
{% endif %}
disable_root: false
chpasswd:
  list: |
{% for login, user in (virtual_preseed_users | default({})).items() %}
{% if user.password|default(False) %}
     {{ login }}:{{ user.password }}
{% endif %}
{% endfor %}
{% if virtual_root_password is defined and virtual_root_password!='' %}
     root:{{ virtual_root_password }}
{% endif %}
  expire: False
packages:
  - qemu-guest-agent
final_message: "cloud-init after $UPTIME seconds"
user-adata:
  timezone: {{ virtual_preseed_timezone }}
{% if virtual_root_password is defined and virtual_root_password != '' and sshd_password_auth %}
write_files:
  - path: /etc/ssh/sshd_config.d/99-root-password-login.conf
    content: |
      PermitRootLogin yes
      PasswordAuthentication yes
runcmd:
  - systemctl restart ssh
{% endif %}
power_state:
  mode: poweroff
  timeout: 30
  condition: true
