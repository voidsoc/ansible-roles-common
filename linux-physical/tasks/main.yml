- name: set distro-specific variables
  include_vars: '{{ item }}'
  with_first_found:
    - "{{ ansible_distribution }}-{{ ansible_distribution_major_version }}.yml"
    - default.yml

- import_tasks: smartmontools.yml
- import_tasks: mdadm.yml

- package:
    name: "{{ packages }}"
    state: present

- name: disable fwupd
  service:
    name: fwupd
    state: stopped
    enabled: no
    masked: yes
  ignore_errors: yes
  when: linux_disable_fwupd

- name: enable fwupd
  service:
    name: fwupd
    enabled: yes
    masked: no
  ignore_errors: yes
  when: not linux_disable_fwupd
